<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المتاهة المتغيرة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--tx:#f3f1ff;--mut:#c4bff0;--gold:#ffd166;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#1b1a3a;color:var(--tx);font-family:Cairo,system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.hud,.bar,.dock{position:relative;z-index:2;width:min(100%,480px);margin:0 auto}
.hud{display:flex;gap:8px;padding:8px 12px 6px}
.pill{flex:1;background:linear-gradient(160deg,rgba(255,255,255,.18),rgba(255,255,255,.06));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:5px 10px;text-align:center;font-weight:800;font-size:22px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.pill.g{background:linear-gradient(160deg,rgba(255,209,102,.35),rgba(255,160,40,.12));border-color:rgba(255,209,102,.5)}
.pill small{display:block;font-size:11px;font-weight:500;color:var(--mut);line-height:1.2}
.pill .low{color:#ff5d73}
.bar{height:14px;margin-top:2px;padding:0 12px}
.bar b{display:block;height:100%;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden}
.bar i{display:block;height:100%;width:100%;border-radius:9px;background:linear-gradient(90deg,#2ee6a6,#ffd166,#ff5d73);background-size:300% 100%}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:6;display:flex;gap:10px;padding:0 12px}
.dk{flex:1;font:inherit;font-weight:800;font-size:17px;height:54px;border-radius:20px;border:1px solid rgba(255,255,255,.2);background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.07));color:var(--tx);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 20px rgba(0,0,0,.3);cursor:pointer}
.ib{font:inherit;font-size:18px;width:40px;height:40px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.12);color:var(--tx);cursor:pointer}
.ib:active,.go:active,.dk:active{transform:scale(.94)}
.ov,.modal{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:20px 20px 90px;background:rgba(12,10,34,.62);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.modal{z-index:7;padding:20px}
.hide{display:none!important}
.card0,.box{background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.2);border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.card0{padding:22px 24px;text-align:center;max-width:340px;display:flex;flex-direction:column;gap:8px;align-items:center}
.card0 h1{margin:0;font-size:38px;line-height:1.25;background:linear-gradient(90deg,#ffd166,#ff8fb1,#8ec5ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.card0 p{margin:0;color:var(--mut);line-height:1.8;font-size:15px}
.go{font:inherit;font-weight:800;font-size:22px;color:#2a2150;background:linear-gradient(180deg,#ffe08a,#ffb347);border:0;border-radius:18px;padding:12px 44px;cursor:pointer;box-shadow:0 6px 0 #c9822a,0 12px 24px rgba(0,0,0,.3);margin:6px 0 4px}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
.box{width:100%;max-width:440px;max-height:88vh;overflow:auto;touch-action:pan-y;padding:16px}
.bh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;font-weight:800;font-size:22px}
.cb{font-size:18px;color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.sk{background:rgba(0,0,0,.24);border:2px solid transparent;border-radius:16px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:13px}
.sk.sel{border-color:var(--gold)}
.sk canvas{width:64px;height:64px}
.sk button,.up button{font:inherit;font-weight:800;font-size:13px;border:0;border-radius:11px;padding:5px 8px;background:var(--gold);color:#2a2150;cursor:pointer;width:100%}
.up button{width:auto;min-width:76px;padding:8px 10px}
button:disabled{opacity:.45;cursor:default}
.sk button.eq{background:#2ee6a6}
.up{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.24);border-radius:18px;padding:10px;margin-top:10px}
.ui{font-size:34px}.ut{flex:1;display:flex;flex-direction:column;gap:2px}.ut small{color:var(--mut);font-size:12px}
.pips{display:flex;gap:4px;margin-top:3px}.pips i{width:18px;height:7px;border-radius:5px;background:rgba(255,255,255,.18)}.pips i.on{background:var(--gold)}
.sr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid rgba(255,255,255,.1);font-weight:800}
.seg{display:flex;gap:6px}
.seg button{flex:0 0 auto;font:inherit;font-weight:800;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:var(--tx);padding:6px 14px;cursor:pointer}
.tabs button{flex:1;padding:8px 4px;font-size:14px}
.seg button.on{background:var(--gold);color:#2a2150;border-color:var(--gold)}
#toast{position:fixed;z-index:4;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 80px);text-align:center;font-weight:800;font-size:18px;opacity:0;transition:opacity .5s;pointer-events:none;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.stage{width:200px;height:200px;margin-top:-4px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),rgba(255,255,255,0) 68%)}
.stage canvas{width:200px;height:200px}
.card0{max-width:360px;padding:18px 22px 24px;gap:6px;overflow:hidden}
.card0 h1{font-size:48px;filter:drop-shadow(0 4px 14px rgba(255,160,120,.35))}
.chips{display:flex;gap:8px}
.chips span{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:3px 12px;font-weight:800;font-size:14px}
.go{animation:pl 1.6s ease-in-out infinite;width:100%}
@keyframes pl{50%{transform:scale(1.05)}}
.dk{position:relative}
.dk.dot::after{content:'';position:absolute;top:6px;inset-inline-end:8px;width:12px;height:12px;border-radius:50%;background:#ff4d6d;border:2px solid #fff;animation:pl 1.2s infinite}
.tabs.sm button{font-size:12.5px;padding:8px 2px}
.hint{margin:12px 0 4px;color:var(--mut);text-align:center;font-weight:500;font-size:14px;min-height:22px}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.day{background:rgba(0,0,0,.24);border:2px solid transparent;border-radius:14px;padding:8px 2px;text-align:center;font-weight:800;display:flex;flex-direction:column;gap:2px}
.day small{font-size:11px;color:var(--mut)}.day b{font-size:22px}
.day.now{border-color:var(--gold);box-shadow:0 0 14px rgba(255,209,102,.5)}
.day.done{opacity:.55}.day.done::after{content:'✓';color:#2ee6a6}
.big{font:inherit;font-weight:800;font-size:18px;width:100%;margin-top:8px;padding:12px;border:0;border-radius:16px;background:linear-gradient(180deg,#ffe08a,#ffb347);color:#2a2150;box-shadow:0 5px 0 #c9822a;cursor:pointer}
.wh{position:relative;width:260px;max-width:100%;margin:16px auto 0}
.wh canvas{width:100%;display:block;border-radius:50%;box-shadow:0 0 30px rgba(127,107,255,.6)}
.ptr{position:absolute;top:-10px;left:50%;margin-left:-12px;border:12px solid transparent;border-top:22px solid #ff5d73;border-bottom:0;z-index:2}
.pb{height:7px;border-radius:5px;background:rgba(255,255,255,.18);margin-top:4px;overflow:hidden}.pb i{display:block;height:100%;background:linear-gradient(90deg,#2ee6a6,#ffd166)}
.streak{text-align:center;font-size:20px;font-weight:800;margin:12px 0 2px}.streak b{font-size:34px;color:var(--gold)}
#home{position:fixed;inset:0;z-index:5;overflow-y:auto;touch-action:pan-y;background:radial-gradient(120% 55% at 50% 0,#4a2f9e 0,#2a1f66 48%,#1a1540 100%);padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 100px}
.hm{width:min(100%,460px);margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;gap:8px}
.chip{flex:1;text-align:center;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:7px 4px;font-weight:800;font-size:15px}
.chip.g{color:var(--gold)}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:2px 0 6px}
.hero .stage{width:190px;height:190px;margin:0}.hero .stage canvas{width:190px;height:190px}
.hero h1{margin:0;font-size:40px;line-height:1.2;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.hero p{margin:4px 0 14px;color:var(--mut);font-size:14px}
.hm .go{width:100%;max-width:300px}
.sc{background:#2e2366;border:1px solid rgba(255,255,255,.09);border-radius:20px;padding:14px;box-shadow:0 6px 16px rgba(10,6,40,.35)}
.sc h3{margin:0 0 10px;font-size:17px;display:flex;align-items:center;gap:8px}
.sc h3 i{font-style:normal;width:30px;height:30px;border-radius:10px;background:rgba(255,209,102,.16);display:flex;align-items:center;justify-content:center;font-size:17px}
.sc .days{margin:0 0 4px;grid-template-columns:repeat(7,1fr);gap:5px}
.sc .day{padding:6px 0;border-radius:11px}.sc .day small{font-size:10px}.sc .day b{font-size:16px}.sc .day span{font-size:12px}
.sc .up{margin-top:8px;background:rgba(0,0,0,.2);padding:10px}
.wr{display:flex;align-items:center;gap:14px}
.wr .wh{width:150px;flex:none;margin:6px 0 0}
.wr .wi{flex:1;display:flex;flex-direction:column;gap:6px}
.wr .hint{margin:0;text-align:start;font-size:15px;font-weight:800;color:var(--tx)}
.ms{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ms div{background:rgba(0,0,0,.2);border-radius:12px;padding:8px 2px;text-align:center;font-weight:800;font-size:12px;display:flex;flex-direction:column;gap:4px;align-items:center}
.ms button{font:inherit;font-weight:800;font-size:12px;border:0;border-radius:9px;padding:4px 8px;background:var(--gold);color:#2a2150}
body.homeOn #bDaily{display:none}
#home{overflow:hidden;display:flex;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 84px)}
.hm2{width:min(100%,480px);margin:0 auto;display:flex;flex-direction:column;gap:10px;height:100%;min-height:0}
.mid{flex:1;display:flex;align-items:center;gap:8px;min-height:0}
.side{display:flex;flex-direction:column;gap:12px;width:78px;flex:none}
.tile{font:inherit;color:var(--tx);background:#2e2366;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:12px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative;box-shadow:0 6px 14px rgba(10,6,40,.35)}
.tile b{font-size:28px;line-height:1.1}.tile span{font-weight:800;font-size:12.5px}.tile small{font-size:10.5px;color:var(--mut);font-weight:500}
.tile.hot{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 6px 18px rgba(255,209,102,.25)}.tile.hot small{color:var(--gold);font-weight:800}
.tile.hot::after{content:'';position:absolute;top:6px;inset-inline-end:6px;width:10px;height:10px;border-radius:50%;background:#ff4d6d;animation:pl 1.2s infinite}
.tile:active{transform:scale(.95)}
.mid .hero{flex:1;min-width:0;padding:0}
.mid .hero .stage{width:min(176px,100%);height:auto;aspect-ratio:1}
.mid .hero .stage canvas{width:100%;height:100%}
.mid .hero h1{font-size:32px}
.mid .hero p{font-size:13px;margin:2px 0 14px}
.mid .hero .go{font-size:21px;padding:12px 6px;max-width:none}
@media (max-height:640px){.side{gap:8px}.tile{padding:7px 2px}.tile b{font-size:24px}}
#home{background:radial-gradient(circle at 50% 30%,rgba(255,214,140,.5) 0,rgba(255,214,140,0) 34%),linear-gradient(180deg,#2c1f70 0%,#5b3aa6 46%,#b2559a 76%,#f0976e 100%)}
#home::before{content:'';position:fixed;left:0;right:0;bottom:0;height:42%;background:url(data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%20400%20200%27%20preserveAspectRatio=%27none%27%3E%3Cpath%20d=%27M0%20110Q100%2050%20200%20100T400%2080V200H0Z%27%20fill=%27%232a1f66%27/%3E%3Cpath%20d=%27M0%20150Q120%2095%20220%20145T400%20125V200H0Z%27%20fill=%27%231a1540%27/%3E%3C/svg%3E) center bottom/100% 100% no-repeat;pointer-events:none}
.hm2{position:relative;z-index:1}
.hm2 .go{animation:none}
.tile.hot::after{animation:none}
#bDaily{flex:none}
.tb{position:relative;z-index:3;width:min(100%,480px);margin:0 auto;display:flex;direction:ltr;gap:8px;padding:8px 12px 0}
.tb button{width:42px;height:42px;border-radius:13px;border:1px solid rgba(255,255,255,.16);background:rgba(30,22,80,.72);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.tb button:active{transform:scale(.94)}
body:not(.homeOn) .dock{display:none}
.hud{padding-top:6px}
/* ---- v4: prettier home, pets, signal device ---- */
#home{background:radial-gradient(circle at 50% 27%,rgba(255,222,150,.6) 0,rgba(255,222,150,0) 30%),linear-gradient(180deg,#1b1250 0%,#45289a 36%,#a2479b 68%,#f58a6b 100%)}
#home::after{content:'';position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 12% 14%,#fff,transparent),radial-gradient(1.5px 1.5px at 28% 7%,#fff,transparent),radial-gradient(2px 2px at 47% 11%,#ffe9a8,transparent),radial-gradient(1.5px 1.5px at 66% 5%,#fff,transparent),radial-gradient(2px 2px at 82% 13%,#fff,transparent),radial-gradient(1.5px 1.5px at 93% 8%,#ffe9a8,transparent),radial-gradient(1.5px 1.5px at 7% 33%,#fff,transparent),radial-gradient(2px 2px at 91% 36%,#fff,transparent),radial-gradient(1.5px 1.5px at 20% 46%,#ffe9a8,transparent),radial-gradient(1.5px 1.5px at 78% 50%,#fff,transparent);animation:tw 3s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.4}to{opacity:1}}
.top .chip{background:rgba(20,12,60,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.22);border-radius:20px;padding:8px 4px;font-size:16px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.tile{background:linear-gradient(160deg,rgba(255,255,255,.24),rgba(255,255,255,.07));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.3);border-radius:22px}
.tile.wide{flex-direction:row;justify-content:center;gap:10px;padding:10px 12px;width:100%}
.tile.wide b{font-size:24px}.tile.wide small{font-size:12px}
.mid .hero h1{font-size:36px;font-weight:800;background:linear-gradient(180deg,#fff 15%,#ffd98a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 3px 0 rgba(60,20,90,.55)) drop-shadow(0 0 18px rgba(255,200,120,.5))}
.mid .hero p{display:inline-block;background:rgba(20,12,60,.45);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:3px 12px;color:#fff;font-weight:500}
.mid .hero .stage{position:relative;background:radial-gradient(circle,rgba(255,236,170,.6),rgba(255,236,170,0) 68%)}
.mid .hero .stage::before{content:'';position:absolute;inset:4%;border-radius:50%;border:2px dashed rgba(255,255,255,.38);animation:rot 20s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.hm2 .go{position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(180deg,#ffe58f,#ffae3d);box-shadow:0 6px 0 #b8701f,0 14px 28px rgba(0,0,0,.35)}
.hm2 .go::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);animation:sh 2.8s ease-in-out infinite}
@keyframes sh{60%,100%{left:130%}}
@media (prefers-reduced-motion:reduce){#home::after,.mid .hero .stage::before,.hm2 .go::after{animation:none}}
.pe{font-size:44px;line-height:64px;height:64px}
.pf{font-size:10px;color:var(--mut);font-weight:500;min-height:26px;line-height:1.3}
.term{background:rgba(0,20,10,.6);border:1px solid #2ee6a6;border-radius:16px;padding:12px 14px;color:#b6ffe3;line-height:1.9;font-size:15px;box-shadow:inset 0 0 20px rgba(46,230,166,.15);white-space:pre-line;margin-top:6px}
.opt{display:block;width:100%;margin-top:8px;font:inherit;font-weight:800;font-size:16px;padding:12px;border-radius:14px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);color:var(--tx);cursor:pointer}
.opt.bad{background:rgba(255,93,115,.5);animation:shk .35s}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sec{margin-top:10px;background:rgba(255,209,102,.14);border:1px solid rgba(255,209,102,.5);border-radius:14px;padding:10px 12px;font-weight:800;color:var(--gold);line-height:1.9}
/* ---- v5: vault of seven secrets ---- */
.vsvg{display:block;width:min(100%,260px);margin:4px auto 0;filter:drop-shadow(0 8px 18px rgba(0,0,0,.4))}
.botr{display:flex;gap:8px}
.botr .tile.wide{flex:1;width:auto;min-width:0;flex-direction:column;gap:2px;padding:8px 4px;text-align:center}
.botr .tile.vlt{flex:1.5}.botr .tile.vlt b{font-size:36px}
.vp{display:flex;gap:4px}.vp i{width:12px;height:6px;border-radius:4px;background:rgba(255,255,255,.25)}.vp i.on{background:#2ee6a6}
.seg.tabs{gap:4px}.tabs.sm button{font-size:11.5px;padding:8px 1px}
.tile b,.ui,.day b,.pe{filter:drop-shadow(0 3px 6px rgba(0,0,0,.4))}
.tile b{width:46px;height:46px;border-radius:15px;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.38),rgba(255,255,255,.05));display:flex;align-items:center;justify-content:center}
.ui{width:52px;height:52px;border-radius:16px;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.3),rgba(255,255,255,.04));display:flex;align-items:center;justify-content:center}
.pe{background:radial-gradient(circle,rgba(255,236,170,.35),transparent 70%)}
.pill small{font-size:12px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.pill b{text-shadow:0 2px 8px rgba(0,0,0,.35)}
.tile.wide b{width:auto;height:auto;background:none;display:inline}
.ei{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.2em;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}.tile b .ei,.ui .ei{width:1em;height:1em}.pill small .ei{width:1.1em;height:1.1em}
.seg.q{flex-wrap:wrap;justify-content:flex-end}.seg.q button{padding:6px 9px;font-size:12.5px}body.gq0 *{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}body.gq0 #home::after{animation:none}
.fbtn{display:inline-block;font:inherit;font-weight:800;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:var(--gold);color:#2a2150;padding:7px 14px;cursor:pointer;font-size:14px}

#fpsb{position:fixed;left:calc(env(safe-area-inset-left,0px) + 8px);top:calc(env(safe-area-inset-top,0px) + 3px);z-index:20;font-weight:800;font-size:11px;line-height:16px;padding:0 10px;border-radius:9px;background:rgba(0,0,0,.6);color:#2ee6a6;pointer-events:none;direction:ltr}

body.fpsOn #home{padding-top:calc(env(safe-area-inset-top,0px) + 26px)}
body.homeOn .tb{visibility:hidden}
#home{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
.top .chip.st{flex:none;width:56px;display:flex;align-items:center;justify-content:center;padding:0;color:#fff;font:inherit;cursor:pointer}
#shop,#stats,#season{padding:0;align-items:stretch;background:linear-gradient(180deg,#1b1250 0%,#32207f 55%,#6a3a9e 100%);backdrop-filter:none;-webkit-backdrop-filter:none}
#shop .box,#stats .box,#season .box{max-width:520px;max-height:none;height:100%;border-radius:0;border:0;box-shadow:none;background:none;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 24px)}
.bh.pg{position:sticky;top:0;z-index:2;margin:0 -14px 10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;background:linear-gradient(180deg,#1b1250,#271a6c);justify-content:flex-start;gap:12px}
.bh.pg .pt{flex:1}
.stg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:6px}
.stc{background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;gap:2px}
.stc b{font-size:24px;color:var(--gold)}.stc small{font-size:12px;color:var(--mut)}
.sh{margin:18px 0 4px;font-weight:800;font-size:19px}
.rk{display:flex;align-items:center;gap:12px;background:linear-gradient(160deg,rgba(255,209,102,.3),rgba(255,160,40,.1));border:1px solid rgba(255,209,102,.5);border-radius:20px;padding:12px;margin-bottom:10px}
.rki{font-size:46px;line-height:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4))}
.fpsr{margin:-4px 0 6px;font-size:12px;color:var(--mut);line-height:2}
.av{--s:56px;width:var(--s);height:var(--s);border-radius:50%;padding:4px;flex:none;background:rgba(255,255,255,.2);position:relative}
.avi{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4a3a9a,#251a60);display:flex;align-items:center;justify-content:center;font-size:calc(var(--s)*.5);line-height:1}
.fr1{background:linear-gradient(135deg,#e6a46b,#8a5223)}
.fr2{background:linear-gradient(135deg,#fff,#9aa3b5)}
.fr3{background:linear-gradient(135deg,#7dffc0,#12805a);box-shadow:0 0 12px rgba(46,230,166,.6)}
.fr4{background:linear-gradient(135deg,#8ec5ff,#2f6bff);box-shadow:0 0 14px rgba(80,140,255,.7)}
.fr5{background:linear-gradient(135deg,#d6fbff,#35d7ff,#fff);box-shadow:0 0 16px rgba(80,230,255,.8)}
.fr6{background:linear-gradient(135deg,#e69bff,#7a2bff);box-shadow:0 0 16px rgba(160,80,255,.8)}
.fr7{background:conic-gradient(#ff5d73,#ffd166,#2ee6a6,#4aa8ff,#c06bff,#ff5d73);box-shadow:0 0 14px rgba(255,255,255,.4)}
.fr8{background:linear-gradient(135deg,#fff3b0,#ffd166 35%,#b8860b 70%,#ffe08a);box-shadow:0 0 0 2px #7a5a10,0 0 20px rgba(255,209,102,.95);padding:5px}
.fr8::before{content:'👑';position:absolute;top:calc(var(--s)*-.3);left:50%;transform:translateX(-50%);font-size:calc(var(--s)*.4);line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.top .chip.pf{flex:2;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;padding:5px 8px;min-width:0}
.pn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.pcard{display:flex;align-items:center;gap:14px;background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:16px 14px 12px;margin-top:8px}
.pcard .pn{font-size:22px;display:block}
.frg .sk{padding-top:14px}
.sk.lk{opacity:.5}
.prow{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.24);border-radius:16px;padding:8px 10px;margin-top:8px;font-weight:800}
.prow .pn{flex:1;font-size:16px}
input,.nin{user-select:text;-webkit-user-select:text;touch-action:auto}
#welcome{z-index:9;background:rgba(12,10,34,.9)}
#welcome .box{max-width:360px}
.nin{width:100%;font:inherit;font-weight:800;font-size:20px;text-align:center;padding:12px;border-radius:14px;border:2px solid rgba(255,255,255,.3);background:rgba(0,0,0,.3);color:#fff;margin:6px 0}
.nin.bad{border-color:#ff5d73}
.avg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0}
.avg button{font-size:26px;padding:6px 0;border-radius:12px;border:2px solid transparent;background:rgba(255,255,255,.1);cursor:pointer}
.avg button.on{border-color:var(--gold);background:rgba(255,209,102,.2)}
.big.ad{background:linear-gradient(180deg,#7dffc0,#2ee6a6);box-shadow:0 5px 0 #12805a;font-size:16px;margin:8px 0}
.big.ad small{display:block;font-size:12px;font-weight:700;opacity:.8}
#adRev{display:none;margin-top:10px}

function blob(f0,f1,t,d,v){

  lf.connect(lg);lg.connect(o.frequency);o.connect(lp);lp.connect(gn);gn.connect(master);

/* ---------- name & profile (shown on first launch) ---------- */
let wMode='first',wAv='😀';
const AVS=['😀','😎','🤓','🥳','🦁','🐯','🐼','🦊','🐸','🐙','🦄','🚀'];
function renderWelcome(nm){
  const ar=S.lang==='ar',x=(a,e)=>ar?a:e,first=wMode==='first';
  $('welBox').innerHTML=`<div class='bh'><span>${first?x('أهلاً بك! 👋','Welcome! 👋'):wMode==='edit'?x('تعديل ملفي','Edit profile'):x('لاعب جديد','New player')}</span>${first?'':`<button class='ib' data-a='x' aria-label='${tr('close')}'>✕</button>`}</div>
  <p class='hint'>${first?x('اكتب اسمك واختر صورتك. تقدمك يُحفظ باسمك تلقائياً.','Enter your name and pick an avatar. Your progress is saved under your name.'):(wMode==='new'?x('كل لاعب له تقدمه وملفه الخاص.','Every player has their own progress and profile.'):'')}</p>
  <input id='nameIn' class='nin' maxlength='14' autocomplete='off' placeholder='${x('اسمك','Your name')}' value='${esc(nm||'')}'>
  <div class='avg'>${AVS.map(a=>`<button data-a='av' data-v='${a}' class='${a===wAv?'on':''}'>${a}</button>`).join('')}</div>
  <button class='big' data-a='ok'>${first?x('ابدأ اللعب','Start playing'):x('حفظ','Save')}</button>`;
}
function openWelcome(mode){
  wMode=mode;const m=mode==='edit'?me():{nm:'',av:AVS[0]};wAv=m.av||AVS[0];
  renderWelcome(m.nm);$('welcome').classList.remove('hide');paused=true;
  if(mode!=='edit')setTimeout(()=>{const i=$('nameIn');if(i)i.focus()},60);
}
function closeWelcome(){$('welcome').classList.add('hide');paused=false;hud();badge();if(!home.classList.contains('hide'))renderHome();if(!$('stats').classList.contains('hide'))renderProfile()}
$('welBox').onclick=e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='x')return closeWelcome();
  if(a==='av'){wAv=b.dataset.v;$('welBox').querySelectorAll('.avg button').forEach(q=>q.classList.toggle('on',q.dataset.v===wAv));return}

    const inp=$('nameIn'),nm=esc(inp.value).trim().slice(0,14);

};
$('welBox').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nameIn'){e.preventDefault();$('welBox').querySelector('[data-a=ok]').click()}});

<script>
/* ===== AdMob rewarded ads bridge (works only inside the Android app; hidden in a normal browser) =====
   Android side exposes window.AndroidAds { isReady(), showRewarded(requestId), preload() }
   and calls window.onRewardedResult(requestId,'rewarded'|'closed'|'failed') exactly once per ad. */
/* browser-only test: open index.html#adsim to simulate an ad (2s) without Android */
if(!window.AndroidAds&&location.hash==='#adsim')window.AndroidAds={isReady:()=>true,preload(){},showRewarded(id){setTimeout(()=>window.onRewardedResult(id,'rewarded'),2000)}};
window.ADS=(()=>{
  const B=window.AndroidAds,has=!!B&&typeof B.showRewarded==='function';
  const REWARD={coins:50,revive:10},CAP={coins:10,wheel:3},WATCHDOG=180000;
  const reqs={};let seq=0,busy=false,busyAt=0,wasPaused=false,reviveUsed=false;
  const ar=()=>S.lang==='ar',x=(a,e)=>ar()?a:e;
  const st=()=>{const d=tk();if(!S.ads||S.ads.d!==d)S.ads={d,coins:0,wheel:0};return S.ads};
  const remain=k=>CAP[k]-st()[k];
  const ready=()=>{try{return !!B.isReady()}catch(e){return false}};
  function btn(k,dis){
    if(!has)return '';
    const a=k==='coins'?'adc':'adsp',n=remain(k),off=dis||n<=0||busy;
    const t=k==='coins'?x('شاهد إعلانًا واحصل على عملات','Watch an ad for coins'):x('شاهد إعلانًا للفة إضافية','Watch an ad for an extra spin');
    const sub=n<=0?x('وصلت للحد اليومي','Daily limit reached'):(k==='coins'?'+'+REWARD.coins:x('فرصة لربح إطار أو رفيق أو إكسسوار','Chance to win a frame, pet or accessory'))+' · '+n+'/'+CAP[k];
    return `<button class="big ad" data-a="${a}" ${off?'disabled':''}>📺 ${t}<small>${sub}</small></button>`;
  }
  function run(k){
    if(!has)return;
    if(busy&&Date.now()-busyAt>WATCHDOG)busy=false;
    if(busy)return;
    if(k!=='revive'&&remain(k)<=0)return;
    if(k==='revive'&&(reviveUsed||state!=='over'))return;
    if(!ready()){toast(x('الإعلان غير جاهز الآن، حاول بعد لحظات','Ad not ready yet, try again in a moment'));try{B.preload()}catch(e){}return}
    const id='r'+(++seq)+'_'+Date.now();
    reqs[id]=k;busy=true;busyAt=Date.now();wasPaused=paused;paused=true;
    try{B.showRewarded(id)}catch(e){window.onRewardedResult(id,'failed')}
  }
  /* the single place where rewards are granted: the id is deleted first, so one ad can never pay twice */
  window.onRewardedResult=(id,status)=>{
    const k=reqs[id];if(!k)return;delete reqs[id];
    busy=false;paused=wasPaused;
    if(status!=='rewarded'){toast(status==='closed'?x('أغلقت الإعلان قبل اكتماله، لا مكافأة','Ad closed early, no reward'):x('تعذّر عرض الإعلان','Could not show the ad'));refresh();return}
    if(k==='coins'){const a=st();if(a.coins>=CAP.coins)return;a.coins++;S.coins+=REWARD.coins;S.stt.ce+=REWARD.coins;save();hud();sfx('coin');cheer(800);toast('+'+REWARD.coins+' 🪙')}
    else if(k==='wheel'){const a=st();if(a.wheel>=CAP.wheel)return;a.wheel++;save();S.dt=1;spinWheel(true)}
    else if(k==='revive'){
      if(reviveUsed||state!=='over')return;reviveUsed=true;
      S.stt.l=Math.max(0,S.stt.l-1);
      left=REWARD.revive;tot=Math.max(tot,left);pend=[];warn=0;nextCh=interval();
      state='play';ov.classList.add('hide');hideRevive();hud();save();sfx('win');toast(x('فرصة ثانية! +','Second chance! +')+REWARD.revive+x(' ثوانٍ',' s'));
    }
    refresh();
  };
  function refresh(){
    if(!$('shop').classList.contains('hide'))renderShop();
    if(!$('daily').classList.contains('hide')&&!spinning)renderDaily();
  }
  function offerRevive(){
    const b=$('adRev');if(!b)return;
    if(!has||reviveUsed||state!=='over'){b.style.display='none';return}
    b.textContent='📺 '+x('شاهد إعلانًا لفرصة ثانية (+'+REWARD.revive+' ثوانٍ)','Watch an ad for a second chance (+'+REWARD.revive+' s)');
    b.style.display='block';
  }
  const hideRevive=()=>{const b=$('adRev');if(b)b.style.display='none'};
  const lvReset=()=>{reviveUsed=false};
  const bt=$('adRev');if(bt)bt.onclick=()=>run('revive');
  if(has)try{B.preload()}catch(e){}
  return{btn,run,offerRevive,hideRevive,lvReset,has};
})();

</script>
